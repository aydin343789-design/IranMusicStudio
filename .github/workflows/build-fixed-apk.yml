name: Build fixed Music Video Equalizer APK
on:
  push:
    branches: ["feature/pahlavi-studio-soundframe"]
    paths:
      - ".github/workflows/build-fixed-apk.yml"
      - "music-video-equalizer-mixer-fixed.zip"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Extract supplied fixed project
        run: |
          mkdir -p build-src
          unzip -q music-video-equalizer-mixer-fixed.zip -d build-src
          test -f build-src/package.json
          test -f build-src/android/app/build.gradle
      - name: Make a single photo cover the complete soundtrack
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-src/src/App.tsx")
          s = p.read_text()
          anchor = '  const duration = clips.length ? clipTotal : hasAudio ? media.audioDur : 0;\\n'
          effect = """  // A single still image is a full-length music-video background.
            // This avoids requiring any video decoder and keeps the image visible for the whole song.
            useEffect(() => {
              if (!hasAudio || clips.length !== 1 || clips[0].kind !== "image") return;
              const target = Math.max(0.1, media.audioDur);
              if (Math.abs(clips[0].dur - target) < 0.05) return;
              setClips([{ ...clips[0], dur: target }]);
            }, [hasAudio, media.audioDur, clips]);
          """
          if "A single still image is a full-length music-video background." not in s:
              if anchor not in s:
                  raise SystemExit("Could not locate duration declaration in App.tsx")
              s = s.replace(anchor, anchor + effect, 1)
              p.write_text(s)
          PY
      - name: Preserve existing Android app identity
        working-directory: build-src
        run: |
          sed -i 's/com\.soundframe\.studio/com.iranmusicstudio/g' capacitor.config.ts android/app/build.gradle
          sed -i 's/versionCode 2/versionCode 100/' android/app/build.gradle
          mkdir -p android/app/src/main/java/com/iranmusicstudio
          sed -i 's/package com\.soundframe\.studio;/package com.iranmusicstudio;/' android/app/src/main/java/com/soundframe/studio/MainActivity.java
          mv android/app/src/main/java/com/soundframe/studio/MainActivity.java android/app/src/main/java/com/iranmusicstudio/MainActivity.java
      - name: Install dependencies
        working-directory: build-src
        run: npm ci
      - name: Build web app
        working-directory: build-src
        run: npm run build
      - name: Sync Capacitor
        working-directory: build-src
        run: npx cap sync android
      - name: Build debug APK
        working-directory: build-src/android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pahlavi-Studio-fixed-debug-apk
          path: build-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
# Rebuild trigger: use the latest uploaded fixed source archive.
