name: Build Pahlavi Studio APK

on:
  push:
    branches:
      - feature/pahlavi-studio-soundframe
    paths:
      - PahlaviStudio_SoundFrame_full_project.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack the prepared Pahlavi Studio project
        run: |
          test -f PahlaviStudio_SoundFrame_full_project.zip
          mkdir -p /tmp/pahlavi-project
          unzip -q PahlaviStudio_SoundFrame_full_project.zip -d /tmp/pahlavi-project
          test -d /tmp/pahlavi-project/PahlaviStudio_SoundFrame
          cp -a /tmp/pahlavi-project/PahlaviStudio_SoundFrame/. .

      - name: Align Capacitor CLI with Capacitor 8
        run: npm pkg set 'devDependencies.@capacitor/cli=^8.6.2'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pahlavi-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
