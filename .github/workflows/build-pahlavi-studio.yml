name: Build Pahlavi Studio APK

on:
  push:
    branches:
      - feature/pahlavi-studio-soundframe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack the prepared Pahlavi Studio project
        run: |
          test -f "PahlaviStudio_SoundFrame_full_project .zip"
          mkdir -p /tmp/pahlavi-project
          unzip -q "PahlaviStudio_SoundFrame_full_project .zip" -d /tmp/pahlavi-project
          test -d /tmp/pahlavi-project/PahlaviStudio_SoundFrame
          cp -a /tmp/pahlavi-project/PahlaviStudio_SoundFrame/. .

      - name: Inspect source files before feature updates
        run: |
          echo "=== SOURCE FILE INVENTORY ==="
          find src -type f 2>/dev/null | sort
          echo "=== PROJECT CONFIG ==="
          sed -n '1,220p' package.json
          echo "=== APP ENTRY FILES ==="
          for f in index.html src/*; do
            if [ -f "$f" ]; then
              case "$f" in
                *.js|*.jsx|*.ts|*.tsx|*.css|*.html)
                  echo "===== FILE: $f ====="
                  sed -n '1,360p' "$f"
                  ;;
              esac
            fi
          done

      - name: Align Capacitor CLI with Capacitor 8
        run: npm pkg set 'devDependencies.@capacitor/cli=^8.6.2'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pahlavi-Studio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
